<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دليل صفوى — دليلك الشامل لمشاريع مدينة صفوى</title>
<meta name="description" content="دليل صفوى — اكتشف أفضل المطاعم والمحلات والخدمات في مدينة صفوى">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0a;--surface:#141414;--card:#1a1a1a;--border:#222;
  --orange:#f26522;--orange-light:#ff8c42;--orange-dark:#c84d0a;
  --text:#f0f0f0;--muted:#777;--promoted-bg:#1f1408;--promoted-border:#7a3010;
}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',Tahoma,sans-serif;min-height:100vh}
a{text-decoration:none}
button{cursor:pointer;font-family:inherit}

/* ── Header ── */
header{background:linear-gradient(135deg,#111,#1a0d04);border-bottom:2px solid var(--orange);position:sticky;top:0;z-index:50}
.header-inner{max-width:1100px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.logo-wrap{display:flex;align-items:center;gap:12px}
.logo-img{width:52px;height:52px;object-fit:contain;mix-blend-mode:screen}
.logo-title{font-size:22px;font-weight:900;color:var(--orange)}
.logo-sub{font-size:11px;color:var(--muted);margin-top:2px}
.header-actions{display:flex;gap:9px;flex-wrap:wrap}
.btn-pricing{background:transparent;border:1px solid var(--orange);color:var(--orange);border-radius:8px;padding:8px 14px;font-weight:600;font-size:12px}
.btn-add{background:linear-gradient(135deg,var(--orange),var(--orange-light));color:#fff;border:none;border-radius:8px;padding:8px 16px;font-weight:700;font-size:12px}

/* ── Banner ── */
.banner-wrap{max-width:1100px;margin:22px auto 0;padding:0 20px}
.banner-label{font-size:11px;color:var(--muted);margin-bottom:7px;font-weight:700;letter-spacing:1px}
.banner-card{border-radius:13px;padding:22px 26px 44px;cursor:pointer;position:relative;min-height:100px;transition:.3s}
.banner-biz{font-size:12px;color:rgba(255,255,255,.55);margin-bottom:5px}
.banner-text{font-size:17px;font-weight:700;color:#fff;margin-bottom:8px;line-height:1.4}
.banner-cta{font-size:12px;color:rgba(255,255,255,.75);font-weight:600}
.banner-dots{position:absolute;bottom:14px;left:20px;display:flex;gap:5px}
.dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.3);cursor:pointer;border:none;transition:.2s}
.dot.active{background:var(--orange);width:20px;border-radius:4px}
.banner-hidden{display:none}

/* ── Search ── */
.search-wrap{max-width:700px;margin:20px auto 0;padding:0 20px}
.search-box{display:flex;align-items:center;background:var(--surface);border:1px solid #333;border-radius:11px;padding:0 13px;gap:9px}
.search-input{flex:1;background:none;border:none;outline:none;color:var(--text);font-size:14px;padding:12px 0;direction:rtl;font-family:inherit}
.clear-btn{background:none;border:none;color:var(--muted);font-size:12px}

/* ── Categories ── */
.cats-outer{padding:16px 0 0;overflow-x:auto}
.cats-scroll{display:flex;gap:7px;padding:0 20px;width:max-content}
.cat-btn{background:var(--surface);border:1px solid #2a2a2a;color:var(--muted);border-radius:20px;padding:6px 13px;font-size:12px;white-space:nowrap;display:flex;align-items:center;gap:5px;font-family:inherit}
.cat-btn.active{background:var(--orange);border-color:var(--orange);color:#fff;font-weight:700}

/* ── Results ── */
.results-bar{max-width:1100px;margin:14px auto 0;padding:0 20px;display:flex;align-items:center;gap:9px}
.results-count{font-size:12px;color:var(--muted)}
.active-tag{background:var(--surface);border:1px solid #333;color:var(--text);font-size:11px;padding:3px 9px;border-radius:18px;display:inline-flex;align-items:center;gap:5px}
.active-tag button{background:none;border:none;color:var(--muted);font-size:10px;cursor:pointer}

/* ── Grid ── */
.grid{max-width:1100px;margin:13px auto 0;padding:0 20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;padding-bottom:20px}
.empty{grid-column:1/-1;text-align:center;padding:56px;color:var(--muted);font-size:17px}

/* ── Card ── */
.card{background:var(--card);border:1px solid #252525;border-radius:13px;padding:15px;cursor:pointer;position:relative;overflow:hidden;transition:border-color .15s}
.card:hover{border-color:#3a3a3a}
.card.promoted{background:var(--promoted-bg);border:1px solid var(--promoted-border);box-shadow:0 0 20px rgba(242,101,34,.12)}
.promoted-badge{position:absolute;top:10px;left:10px;background:linear-gradient(135deg,var(--orange-dark),var(--orange));color:#fff;font-size:10px;font-weight:700;padding:2px 8px;border-radius:18px}
.card-header{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.card-logo{width:44px;height:44px;border-radius:9px;background:#252525;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;overflow:hidden}
.card-logo img{width:100%;height:100%;object-fit:cover}
.card-name{font-weight:700;font-size:14px;color:var(--text)}
.card-cat{font-size:11px;color:var(--muted);margin-top:2px}
.card-desc{font-size:12px;color:var(--muted);line-height:1.6;margin-bottom:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.tag{background:var(--surface);border:1px solid #2a2a2a;color:var(--muted);font-size:10px;padding:2px 7px;border-radius:9px}
.card-social{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.social-chip{background:#1f1408;border:1px solid var(--promoted-border);font-size:12px;padding:2px 6px;border-radius:9px;color:var(--orange)}
.card-footer{display:flex;align-items:center;justify-content:space-between}
.card-location{font-size:11px;color:var(--muted)}
.card-more{font-size:11px;color:var(--orange);font-weight:600}

/* ── Promo CTA ── */
.promo-cta-wrap{max-width:1100px;margin:26px auto 0;padding:0 20px}
.promo-cta-inner{background:linear-gradient(135deg,#1f1005,#140a02);border:1px solid var(--promoted-border);border-radius:13px;padding:20px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:13px}
.promo-cta-title{font-size:15px;font-weight:700;color:var(--orange-light);margin-bottom:4px}
.promo-cta-sub{font-size:12px;color:var(--muted)}
.promo-price{font-size:20px;font-weight:800;color:var(--orange)}
.promo-price span{font-size:13px;color:var(--muted);font-weight:400}

/* ── Footer ── */
footer{text-align:center;padding:24px 20px;color:#444;font-size:11px;margin-top:20px;border-top:1px solid #1a1a1a}

/* ── Modal ── */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:100;align-items:center;justify-content:center;padding:14px}
.overlay.open{display:flex}
.modal-box{background:#111;border:1px solid #2a2a2a;border-radius:15px;width:100%;max-width:520px;position:relative;max-height:92vh;display:flex;flex-direction:column}
.modal-close{position:absolute;top:10px;left:12px;background:none;border:none;color:var(--muted);font-size:16px}
.modal-scroll{overflow-y:auto;padding:20px}

/* ── Detail ── */
.detail-badge{display:inline-block;background:linear-gradient(135deg,var(--orange-dark),var(--orange));color:#fff;font-size:10px;font-weight:700;padding:3px 10px;border-radius:18px;margin-bottom:11px}
.detail-img{width:100%;border-radius:10px;margin-bottom:14px;object-fit:cover;max-height:180px}
.detail-header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.detail-logo{width:58px;height:58px;border-radius:9px;background:#252525;display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0;overflow:hidden}
.detail-logo img{width:100%;height:100%;object-fit:cover}
.detail-name{font-size:18px;font-weight:700;color:var(--text)}
.detail-cat{font-size:12px;color:var(--muted);margin-top:3px}
.detail-desc{font-size:13px;color:var(--muted);line-height:1.7;margin-bottom:14px}
.detail-section{margin-bottom:12px;padding:12px;background:var(--card);border-radius:9px;border:1px solid #252525}
.detail-section-title{font-weight:700;font-size:12px;margin-bottom:7px;color:var(--text)}
.detail-section-val{font-size:13px;color:var(--muted)}
.social-btns{display:flex;flex-wrap:wrap;gap:7px}
.social-btn{padding:7px 13px;border-radius:7px;color:#fff;font-size:12px;font-weight:600}
.contact-row{display:flex;gap:10px;margin-top:16px}
.contact-btn{flex:1;color:#fff;border:none;border-radius:9px;padding:12px;text-align:center;font-weight:700;font-size:13px;cursor:pointer}

/* ── Form ── */
.form-section{font-size:11px;font-weight:700;color:var(--orange);margin-bottom:9px;margin-top:4px;padding-bottom:6px;border-bottom:1px solid #2a2a2a;text-transform:uppercase;letter-spacing:.5px}
.form-label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px;font-weight:600}
.form-input{width:100%;background:var(--card);border:1px solid #2a2a2a;border-radius:7px;padding:9px 10px;color:var(--text);font-size:13px;margin-bottom:11px;outline:none;direction:rtl;font-family:inherit}
.form-input:focus{border-color:var(--orange)}
.social-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 11px}
.logo-upload-row{display:flex;gap:14px;align-items:flex-start;margin-bottom:16px}
.logo-upload-box{width:80px;height:80px;border-radius:12px;border:2px dashed var(--orange);background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;overflow:hidden}
.logo-upload-box img{width:100%;height:100%;object-fit:cover}
.upload-area{border:2px dashed #2a2a2a;border-radius:9px;padding:18px;text-align:center;cursor:pointer;margin-bottom:9px;background:var(--card);min-height:80px;display:flex;align-items:center;justify-content:center}
.upload-area img{max-width:100%;max-height:130px;border-radius:7px;object-fit:cover}
.promo-check{background:#1f1005;border:1px solid var(--promoted-border);border-radius:7px;padding:10px;font-size:13px;color:var(--text);margin-bottom:7px;display:flex;align-items:center;gap:8px}
.form-actions{display:flex;gap:8px;margin-top:4px}
.btn-submit{flex:1;background:linear-gradient(135deg,var(--orange),var(--orange-light));color:#fff;border:none;border-radius:7px;padding:11px;font-weight:700;font-size:13px;font-family:inherit}
.btn-cancel{background:var(--card);border:1px solid #2a2a2a;color:var(--muted);border-radius:7px;padding:11px 16px;font-size:12px;font-family:inherit}
.validation-hint{font-size:12px;color:var(--orange);text-align:center;margin-top:8px}

/* ── Pricing ── */
.pricing-header{text-align:center;margin-bottom:20px}
.pricing-icon{font-size:44px;margin-bottom:8px}
.pricing-title{font-size:20px;font-weight:800;color:var(--orange);margin-bottom:6px}
.pricing-amount{font-size:38px;font-weight:900;color:var(--text)}
.pricing-features{background:var(--card);border:1px solid #252525;border-radius:11px;padding:15px;margin-bottom:14px}
.pricing-feature{font-size:13px;color:var(--text);padding:7px 0;border-bottom:1px solid #222}
.pricing-feature span{color:var(--orange);font-weight:700;margin-left:7px}
.pricing-note{font-size:12px;color:var(--muted);text-align:center;margin-bottom:14px}

/* ── Success ── */
.success-wrap{text-align:center;padding:36px 20px}
.success-icon{font-size:52px;margin-bottom:14px}
.success-title{font-size:18px;font-weight:700;color:var(--orange);margin-bottom:7px}
.success-sub{font-size:13px;color:var(--muted)}

@media(max-width:600px){
  .header-inner{padding:12px 14px}
  .logo-title{font-size:18px}
  .banner-text{font-size:14px}
  .social-grid{grid-template-columns:1fr}
}
</style>
</head>

// ── State ────────────────────────────────────────────
let activeCategory = "all";
let bannerIdx = 0;
let bannerTimer = null;
let currentBusiness = null;

// ── Init ─────────────────────────────────────────────
function init() {
  buildCategories();
  filterBusinesses();
  initBanner();
  renderPricing();
  renderForm();
}

function getCat(id) { return CATEGORIES.find(c=>c.id===id) || {icon:"🏢",label:""}; }

// ── Categories ───────────────────────────────────────
function buildCategories() {
  const wrap = document.getElementById("cats-scroll");
  let html = `<button class="cat-btn active" onclick="setCategory('all',this)">🗂️ الكل</button>`;
  CATEGORIES.forEach(c => {
    html += `<button class="cat-btn" onclick="setCategory('${c.id}',this)">${c.icon} ${c.label}</button>`;
  });
  wrap.innerHTML = html;
}

function setCategory(id, btn) {
  activeCategory = id;
  document.querySelectorAll(".cat-btn").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  filterBusinesses();
}

// ── Filter & Render ──────────────────────────────────
function filterBusinesses() {
  const q = document.getElementById("search-input").value.toLowerCase().trim();
  const sorted = [...BUSINESSES].sort((a,b)=>(b.promoted?1:0)-(a.promoted?1:0));
  const filtered = sorted.filter(b => {
    const matchCat = activeCategory==="all" || b.category===activeCategory;
    const matchQ = !q || b.name.includes(q) || (b.description||"").includes(q) ||
                   (b.tags||[]).some(t=>t.includes(q)) || (b.location||"").includes(q);
    return matchCat && matchQ;
  });
  document.getElementById("results-count").textContent = filtered.length + " مشروع";
  const tagWrap = document.getElementById("active-tag-wrap");
  if (activeCategory!=="all") {
    const cat = getCat(activeCategory);
    tagWrap.innerHTML = `<span class="active-tag">${cat.label}<button onclick="setCategory('all',document.querySelector('.cat-btn'))">✕</button></span>`;
  } else tagWrap.innerHTML = "";
  renderGrid(filtered);
}

function clearSearch() {
  document.getElementById("search-input").value = "";
  filterBusinesses();
}

function renderGrid(list) {
  const grid = document.getElementById("business-grid");
  if (!list.length) { grid.innerHTML = `<div class="empty">لا توجد نتائج مطابقة</div>`; return; }
  grid.innerHTML = list.map(b => {
    const cat = getCat(b.category);
    const logoHtml = b.logoUrl
      ? `<img src="${b.logoUrl}" alt="">`
      : `<span>${cat.icon}</span>`;
    const tagsHtml = (b.tags||[]).map(t=>`<span class="tag">${t}</span>`).join("");
    const socialHtml = [b.instagram&&"📸",b.twitter&&"𝕏",b.snapchat&&"👻",b.tiktok&&"🎵"]
      .filter(Boolean).map(i=>`<span class="social-chip">${i}</span>`).join("");
    return `
    <div class="card${b.promoted?" promoted":""}" onclick="openBusiness(${b.id})">
      ${b.promoted?`<div class="promoted-badge">${b.badge||"مميز"}</div>`:""}
      <div class="card-header">
        <div class="card-logo">${logoHtml}</div>
        <div><div class="card-name">${b.name}</div><div class="card-cat">${cat.icon} ${cat.label}</div></div>
      </div>
      <div class="card-desc">${b.description||""}</div>
      <div class="card-tags">${tagsHtml}</div>
      ${socialHtml?`<div class="card-social">${socialHtml}</div>`:""}
      <div class="card-footer">
        <span class="card-location">📍 ${b.location||""}</span>
        <span class="card-more">التفاصيل ←</span>
      </div>
    </div>`;
  }).join("");
}

// ── Business Detail ──────────────────────────────────
function openBusiness(id) {
  const b = BUSINESSES.find(x=>x.id===id);
  if (!b) return;
  currentBusiness = b;
  const cat = getCat(b.category);
  const logoHtml = b.logoUrl ? `<img src="${b.logoUrl}" alt="">` : cat.icon;
  let html = "";
  if (b.promoted) html += `<div class="detail-badge">${b.badge||"مميز"}</div>`;
  if (b.productImageUrl) html += `<img src="${b.productImageUrl}" class="detail-img" alt="صورة المنتجات">`;
  html += `
  <div class="detail-header">
    <div class="detail-logo">${logoHtml}</div>
    <div><div class="detail-name">${b.name}</div><div class="detail-cat">${cat.icon} ${cat.label}</div></div>
  </div>
  <p class="detail-desc">${b.description||""}</p>
  <div class="detail-section">
    <div class="detail-section-title">📍 الموقع</div>
    <div class="detail-section-val">${b.location||""}</div>
  </div>`;
  const socials = [
    b.instagram&&`<a href="https://instagram.com/${b.instagram}" target="_blank" class="social-btn" style="background:#c13584">📸 Instagram</a>`,
    b.twitter&&`<a href="https://twitter.com/${b.twitter}" target="_blank" class="social-btn" style="background:#1a8cd8">𝕏 Twitter</a>`,
    b.snapchat&&`<a href="https://snapchat.com/add/${b.snapchat}" target="_blank" class="social-btn" style="background:#FFFC00;color:#000">👻 Snapchat</a>`,
    b.tiktok&&`<a href="https://tiktok.com/@${b.tiktok}" target="_blank" class="social-btn" style="background:#111">🎵 TikTok</a>`,
  ].filter(Boolean);
  if (socials.length) html += `<div class="detail-section"><div class="detail-section-title">📱 التواصل الاجتماعي</div><div class="social-btns">${socials.join("")}</div></div>`;
  if (b.website) html += `<div class="detail-section"><div class="detail-section-title">🌐 الموقع الإلكتروني</div><a href="${b.website}" target="_blank" style="color:var(--orange);font-size:13px;font-weight:600;word-break:break-all">${b.website.replace(/^https?:\/\//,"")}</a></div>`;
  html += `<div class="contact-row">
    <a href="tel:${b.phone}" class="contact-btn" style="background:var(--orange)">📞 اتصال</a>
    <a href="https://wa.me/966${(b.whatsapp||"").replace(/^0/,"")}" target="_blank" class="contact-btn" style="background:#25d366">💬 واتساب</a>
  </div>`;
  document.getElementById("modal-business-content").innerHTML = html;
  openModal("business");
}

// ── Banner ───────────────────────────────────────────
function initBanner() {
  const promoted = BUSINESSES.filter(b=>b.promoted&&b.adText);
  if (!promoted.length) { document.querySelector(".banner-wrap").style.display="none"; return; }
  function showBanner(idx) {
    const b = promoted[idx];
    document.getElementById("banner-card").style.background = b.adGrad||"linear-gradient(135deg,#1a3a2a,#2d6a4a)";
    document.getElementById("banner-biz").textContent = b.name;
    document.getElementById("banner-text").textContent = b.adText;
    const dots = document.getElementById("banner-dots");
    dots.innerHTML = promoted.map((_,i)=>`<button class="dot${i===idx?" active":""}" onclick="event.stopPropagation();showBannerIdx(${i})"></button>`).join("");
    currentBannerBusiness = b;
  }
  window.currentBannerBusiness = promoted[0];
  window.showBannerIdx = function(i) { bannerIdx=i; showBanner(i); };
  showBanner(0);
  if (bannerTimer) clearInterval(bannerTimer);
  bannerTimer = setInterval(()=>{ bannerIdx=(bannerIdx+1)%promoted.length; showBanner(bannerIdx); }, 4200);
}
function openBusinessFromBanner() {
  if (window.currentBannerBusiness) openBusiness(window.currentBannerBusiness.id);
}

}

// ── Request Form ─────────────────────────────────────
function renderForm() {
  const catsOptions = CATEGORIES.map(c=>`<option value="${c.id}">${c.icon} ${c.label}</option>`).join("");
  document.getElementById("modal-request-content").innerHTML = `
  <div style="font-size:16px;font-weight:700;color:var(--orange);margin-bottom:5px">طلب إضافة مشروع</div>
  <div style="font-size:12px;color:var(--muted);margin-bottom:16px">الإضافة في دليل صفوى مجانية — سيتم مراجعة طلبك خلال ٢٤ ساعة</div>

  <div class="form-section">شعار المتجر *</div>
  <div class="logo-upload-row">
    <div class="logo-upload-box" id="logo-box" onclick="document.getElementById('logo-input').click()">
      <div id="logo-placeholder" style="text-align:center"><div style="font-size:22px">🏷️</div><div style="font-size:10px;color:var(--orange);font-weight:600">ارفع الشعار</div></div>
    </div>
    <input type="file" id="logo-input" accept="image/*" style="display:none" onchange="previewFile(this,'logo-box','logo-placeholder')">
    <div>
      <div style="font-size:13px;font-weight:700;color:var(--text);margin-bottom:4px">شعار المتجر مطلوب</div>
      <div style="font-size:11px;color:var(--muted);margin-bottom:3px">يظهر على بطاقة المشروع</div>
      <div style="font-size:11px;color:var(--muted)">صورة مربعة، خلفية شفافة أو بيضاء</div>
      <div id="logo-required-hint" style="font-size:11px;color:var(--orange);margin-top:5px">⚠️ مطلوب لإرسال الطلب</div>
    </div>
  </div>

  <div class="form-section">معلومات المشروع</div>
  <label class="form-label">اسم المشروع *</label>
  <input class="form-input" id="f-name" placeholder="مطعم الأصيل..." oninput="checkValid()">
  <label class="form-label">اسم صاحب المشروع</label>
  <input class="form-input" id="f-owner" placeholder="محمد العمري...">
  <label class="form-label">التصنيف *</label>
  <select class="form-input" id="f-cat" onchange="checkValid()"><option value="">اختر التصنيف</option>${catsOptions}</select>
  <label class="form-label">رقم الجوال *</label>
  <input class="form-input" id="f-phone" placeholder="05xxxxxxxx" type="tel" oninput="checkValid()">
  <label class="form-label">رقم الواتساب</label>
  <input class="form-input" id="f-whatsapp" placeholder="05xxxxxxxx" type="tel">
  <label class="form-label">الموقع / الحي</label>
  <input class="form-input" id="f-location" placeholder="حي النخيل، قرب البنك...">
  <label class="form-label">وصف المشروع</label>
  <textarea class="form-input" id="f-desc" style="height:72px;resize:vertical" placeholder="نبذة عن ما تقدمه..."></textarea>

  <div class="form-section">التواصل الاجتماعي والموقع</div>
  <label class="form-label">🌐 الموقع الإلكتروني</label>
  <input class="form-input" id="f-website" placeholder="https://www.example.com" dir="ltr">
  <div class="social-grid">
    <div><label class="form-label">📸 Instagram</label><input class="form-input" id="f-instagram" placeholder="اسم الحساب"></div>
    <div><label class="form-label">𝕏 Twitter</label><input class="form-input" id="f-twitter" placeholder="اسم الحساب"></div>
    <div><label class="form-label">👻 Snapchat</label><input class="form-input" id="f-snapchat" placeholder="اسم الحساب"></div>
    <div><label class="form-label">🎵 TikTok</label><input class="form-input" id="f-tiktok" placeholder="اسم الحساب"></div>
  </div>

  <div class="form-section">صورة القائمة / البضاعة</div>
  <div class="upload-area" id="img-box" onclick="document.getElementById('img-input').click()">
    <div id="img-placeholder"><div style="font-size:28px;margin-bottom:5px">📷</div><div style="font-size:13px;color:var(--text);font-weight:600">اضغط لرفع صورة</div><div style="font-size:11px;color:var(--muted);margin-top:3px">قائمة طعام، بضاعة، عروض عقارية...</div></div>
  </div>
  <input type="file" id="img-input" accept="image/*" style="display:none" onchange="previewFile(this,'img-box','img-placeholder')">

  <div class="promo-check">
    <input type="checkbox" id="f-promoted">
    <label for="f-promoted" style="cursor:pointer">🚀 أريد الإعلان المميز — <strong>٥٠ ريال / شهر</strong></label>
  </div>

    <button class="btn-cancel" onclick="closeModal('request')">إلغاء</button>

  document.getElementById("f-promoted").addEventListener("change", function() {
    document.getElementById("promo-note").style.display = this.checked ? "block" : "none";
  });

let logoSelected = false;
function previewFile(input, boxId, placeholderId) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const box = document.getElementById(boxId);
    const img = document.createElement("img");
    img.src = ev.target.result;
    img.style.cssText = "width:100%;height:100%;object-fit:cover;border-radius:inherit";
    box.innerHTML = "";
    box.appendChild(img);
    if (boxId === "logo-box") {
      logoSelected = true;
      document.getElementById("logo-required-hint").style.display = "none";
    }
    checkValid();
  };
  reader.readAsDataURL(file);
}

function checkValid() {
  const name  = document.getElementById("f-name")?.value.trim();
  const cat   = document.getElementById("f-cat")?.value;
  const phone = document.getElementById("f-phone")?.value.trim();
  const valid = name && cat && phone && logoSelected;
  const btn   = document.getElementById("submit-btn");
  const hint  = document.getElementById("validation-hint");
  if (btn) { btn.disabled = !valid; btn.style.opacity = valid?"1":".5"; btn.style.cursor = valid?"pointer":"not-allowed"; }
  if (hint) {
    if (!logoSelected) hint.textContent = "⚠️ الشعار مطلوب";
    else if (!name)    hint.textContent = "⚠️ اسم المشروع مطلوب";
    else if (!cat)     hint.textContent = "⚠️ التصنيف مطلوب";
    else if (!phone)   hint.textContent = "⚠️ رقم الجوال مطلوب";
    else               hint.textContent = "";
  }
}

async function submitForm() {
  const btn = document.getElementById("submit-btn");
  btn.textContent = "جاري الإرسال...";
  btn.disabled = true;

  const data = {
    "اسم المشروع":    document.getElementById("f-name").value,
    "اسم الصاحب":     document.getElementById("f-owner").value,
    "التصنيف":        document.getElementById("f-cat").value,
    "الجوال":         document.getElementById("f-phone").value,
    "واتساب":         document.getElementById("f-whatsapp").value,
    "الموقع/الحي":    document.getElementById("f-location").value,
    "الوصف":          document.getElementById("f-desc").value,
    "الموقع الالكتروني": document.getElementById("f-website").value,
    "Instagram":      document.getElementById("f-instagram").value,
    "Twitter":        document.getElementById("f-twitter").value,
    "Snapchat":       document.getElementById("f-snapchat").value,
    "TikTok":         document.getElementById("f-tiktok").value,
    "إعلان مميز":     document.getElementById("f-promoted").checked ? "نعم — ٥٠ ريال/شهر" : "لا",
    "_subject":       "طلب إضافة مشروع — دليل صفوى",
  };

  try {
    const res = await fetch(FORMSPREE_URL, {
      method:"POST", headers:{"Content-Type":"application/json","Accept":"application/json"},
      body: JSON.stringify(data)
    });
    if (res.ok) {
      document.getElementById("modal-request-content").innerHTML = `
      <div class="success-wrap">
        <div class="success-icon">✅</div>
        <div class="success-title">تم إرسال طلبك بنجاح!</div>
        <div class="success-sub">سنتواصل معك خلال ٢٤ ساعة لإتمام الإضافة</div>
      </div>`;
      logoSelected = false;
      setTimeout(()=>{ closeModal("request"); renderForm(); }, 3000);
    } else {
      throw new Error("فشل الإرسال");
    }
  } catch(e) {
    document.getElementById("form-error").style.display = "block";
    document.getElementById("form-error").textContent = "⚠️ تعذّر الإرسال، تأكد من اتصال الإنترنت وحاول مجدداً.";
    btn.textContent = "إرسال الطلب";
    btn.disabled = false;
  }
}

// ── Modal Helpers ────────────────────────────────────
function openModal(id)  { document.getElementById("modal-"+id).classList.add("open"); document.body.style.overflow="hidden"; }
function closeModal(id) { document.getElementById("modal-"+id).classList.remove("open"); document.body.style.overflow=""; }

// ── Start ────────────────────────────────────────────
init();
</script>
