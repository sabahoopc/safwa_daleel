<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فاتورة — دليل صفوى</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Cairo",sans-serif;background:#f0ede8;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:30px 16px 60px;direction:rtl}
.invoice{background:#fff;width:100%;max-width:720px;border-radius:20px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.12)}
.inv-header{background:linear-gradient(135deg,#1a0d04 0%,#2a1405 50%,#f26522 100%);padding:36px 40px;position:relative;overflow:hidden}
.inv-header::before{content:"";position:absolute;inset:0;background:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E")}
.inv-header-top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;position:relative}
.inv-logo{display:flex;align-items:center;gap:12px}
.inv-logo img{width:52px;height:52px;object-fit:contain;mix-blend-mode:screen;filter:brightness(1.2)}
.inv-brand{color:#fff}
.inv-brand-name{font-size:20px;font-weight:900;letter-spacing:-.3px}
.inv-brand-sub{font-size:11px;color:rgba(255,255,255,.6);margin-top:2px}
.inv-badge{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);color:#fff;padding:6px 16px;border-radius:20px;font-size:13px;font-weight:700;backdrop-filter:blur(4px)}
.inv-num-row{display:flex;align-items:flex-end;justify-content:space-between;margin-top:28px;flex-wrap:wrap;gap:12px;position:relative}
.inv-num{color:#fff}
.inv-num-label{font-size:11px;color:rgba(255,255,255,.55);margin-bottom:4px;font-weight:600;letter-spacing:1px;text-transform:uppercase}
.inv-num-value{font-size:28px;font-weight:900;letter-spacing:1px}
.inv-date{color:rgba(255,255,255,.7);font-size:13px;text-align:left}
.inv-body{padding:36px 40px}
.inv-parties{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:28px}
@media(max-width:560px){.inv-parties{grid-template-columns:1fr}}
.party-card{background:#faf9f7;border:1px solid #ede9e2;border-radius:14px;padding:18px}
.party-label{font-size:10px;font-weight:700;color:#f26522;letter-spacing:2px;text-transform:uppercase;margin-bottom:10px}
.party-name{font-size:16px;font-weight:800;color:#1a1a1a;margin-bottom:6px}
.party-detail{font-size:13px;color:#666;line-height:1.8}
.divider{height:1px;background:linear-gradient(to left,transparent,#e8e2d9,transparent);margin:8px 0 24px}
.inv-items{width:100%;border-collapse:collapse;margin-bottom:24px}
.inv-items th{background:#1a0d04;color:#fff;padding:11px 16px;font-size:12px;font-weight:700;letter-spacing:.5px;text-align:right}
.inv-items th:last-child{text-align:left;border-radius:0 0 0 10px}
.inv-items th:first-child{border-radius:0 0 10px 0}
.inv-items td{padding:14px 16px;font-size:14px;border-bottom:1px solid #f0ede8;color:#333}
.inv-items td:last-child{text-align:left;font-weight:700;color:#1a1a1a}
.inv-items tr:last-child td{border-bottom:none}
.inv-items tr:hover td{background:#fdf9f5}
.inv-total-row{display:flex;justify-content:flex-end;margin-bottom:28px}
.inv-total-box{background:linear-gradient(135deg,#1a0d04,#2a1405);border-radius:14px;padding:20px 28px;min-width:220px;text-align:center}
.inv-total-label{font-size:11px;color:rgba(255,255,255,.55);font-weight:700;letter-spacing:1px;margin-bottom:6px}
.inv-total-amount{font-size:34px;font-weight:900;color:#fff}
.inv-total-cur{font-size:16px;color:#f26522;margin-right:6px}
.inv-notes{background:#fff8f0;border:1px solid #fde4c8;border-radius:14px;padding:16px 20px;margin-bottom:28px}
.inv-notes-label{font-size:11px;font-weight:700;color:#f26522;letter-spacing:1px;margin-bottom:6px}
.inv-notes-text{font-size:13px;color:#555;line-height:1.8}
.inv-period{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:28px}
.period-item{flex:1;min-width:130px;background:#f7f5f2;border-radius:12px;padding:14px;text-align:center}
.period-label{font-size:11px;color:#999;font-weight:600;margin-bottom:5px}
.period-value{font-size:15px;font-weight:800;color:#1a1a1a}
.inv-footer{border-top:1px solid #ede9e2;padding:24px 40px;flex-wrap:wrap;gap:12px;background:#faf9f7}
.inv-footer-brand{font-size:12px;color:#999;display:flex;align-items:center;gap:8px}
.inv-footer-brand img{width:24px;height:24px;object-fit:contain;opacity:.5}
.inv-footer-contact{font-size:12px;color:#999;text-align:left}
.inv-footer-contact a{color:#f26522;text-decoration:none;font-weight:600}
.print-btn{background:linear-gradient(135deg,#f26522,#ff8c42);color:#fff;border:none;border-radius:12px;padding:13px 28px;font-size:14px;font-weight:700;cursor:pointer;font-family:"Cairo",sans-serif;box-shadow:0 6px 20px rgba(242,101,34,.35);margin-top:20px;display:flex;align-items:center;gap:8px;transition:.2s}
.print-btn:hover{opacity:.9;transform:translateY(-1px)}
.not-found{text-align:center;padding:80px 20px;color:#999}
.not-found h2{font-size:22px;font-weight:800;color:#333;margin-bottom:8px}
@media print{
  body{background:#fff;padding:0}
  .print-btn{display:none!important}
  .invoice{box-shadow:none;border-radius:0;max-width:100%}
}
</style>
</head>
<body>

<div class="invoice" id="invoice-wrap">
  <div style="text-align:center;padding:60px;color:#999" id="loading-state">
    <div style="font-size:32px;margin-bottom:12px">⏳</div>
    <div style="font-weight:600">جاري تحميل الفاتورة...</div>
  </div>
</div>

<button class="print-btn" id="print-btn" style="display:none" onclick="window.print()">
  🖨️ طباعة / حفظ PDF
</button>

<script>
const SUPA_URL = "https://nymirlsjshrykhgxrylr.supabase.co";
const SUPA_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im55bWlybHNqc2hyeWtoZ3hyeWxyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkyNzU5NzMsImV4cCI6MjA5NDg1MTk3M30.-Ow1WzfGBqvu6NRGXQoSJ_ai0cE6-1_DBDFq8bDsmX8";
const LOGO    = "";

function toArabicDate(str){
  if(!str) return "—";
  return new Date(str).toLocaleDateString("ar-SA",{year:"numeric",month:"long",day:"numeric"});
}

function toArabicNum(n){
  return Number(n).toLocaleString("ar-SA",{minimumFractionDigits:2,maximumFractionDigits:2});
}

async function load(){
  const params = new URLSearchParams(location.search);
  const id = params.get("id");
  if(!id){ showError("لم يتم تحديد رقم الفاتورة"); return; }

  try{
    const res = await fetch(SUPA_URL+"/rest/v1/invoices?select=*&id=eq."+id,{
      headers:{"apikey":SUPA_KEY,"Authorization":"Bearer "+SUPA_KEY}
    });
    const data = await res.json();
    if(!data||!data.length){ showError("الفاتورة غير موجودة أو تم حذفها"); return; }
    render(data[0]);
  }catch(e){ showError("تعذّر تحميل الفاتورة"); }
}

function showError(msg){
  document.getElementById("invoice-wrap").innerHTML = `
    <div class="not-found">
      <div style="font-size:48px;margin-bottom:16px">🔍</div>
      <h2>لم نجد الفاتورة</h2>
      <p>${msg}</p>
    </div>`;
}

function render(inv){
  const serviceLabel = inv.service_type === "promoted" ? "إعلان مميز" :
                       inv.service_type === "popup"    ? "إعلان منبثق" : inv.service_type;
  document.getElementById("invoice-wrap").innerHTML = `
    <div class="inv-header">
      <div class="inv-header-top">
        <div class="inv-logo">
          <img src="${LOGO}" alt="دليل صفوى">
          <div class="inv-brand">
            <div class="inv-brand-name">دليل صفوى</div>
            <div class="inv-brand-sub">1safwa.com</div>
          </div>
        </div>
        <div class="inv-badge">فاتورة إعلانية</div>
      </div>
      <div class="inv-num-row">
        <div class="inv-num">
          <div class="inv-num-label">رقم الفاتورة</div>
          <div class="inv-num-value">${inv.invoice_number}</div>
        </div>
        <div class="inv-date">
          <div style="font-size:11px;color:rgba(255,255,255,.5);margin-bottom:3px">تاريخ الإصدار</div>
          <div>${toArabicDate(inv.created_at)}</div>
        </div>
      </div>
    </div>

    <div class="inv-body">
      <div class="inv-parties">
        <div class="party-card">
          <div class="party-label">من</div>
          <div class="party-name">دليل صفوى</div>
          <div class="party-detail">
            🌐 1safwa.com<br>
            ✉️ info@1safwa.com<br>
            📱 واتساب متاح
          </div>
        </div>
        <div class="party-card">
          <div class="party-label">إلى</div>
          <div class="party-name">${inv.client_name}</div>
          <div class="party-detail">
            ${inv.business_name ? "🏪 "+inv.business_name+"<br>" : ""}
            ${inv.client_phone ? "📱 "+inv.client_phone+"<br>" : ""}
            ${inv.client_email ? "✉️ "+inv.client_email : ""}
          </div>
        </div>
      </div>

      ${(inv.start_date||inv.end_date) ? `
      <div class="inv-period">
        ${inv.start_date ? `<div class="period-item"><div class="period-label">📅 تاريخ البداية</div><div class="period-value">${toArabicDate(inv.start_date)}</div></div>` : ""}
        ${inv.end_date ? `<div class="period-item"><div class="period-label">📅 تاريخ الانتهاء</div><div class="period-value">${toArabicDate(inv.end_date)}</div></div>` : ""}
        ${inv.start_date&&inv.end_date ? `<div class="period-item"><div class="period-label">⏱️ المدة</div><div class="period-value">${Math.round((new Date(inv.end_date)-new Date(inv.start_date))/(1000*60*60*24))+1} يوم</div></div>` : ""}
      </div>` : ""}

      <div class="divider"></div>

      <table class="inv-items">
        <thead><tr>
          <th>الخدمة</th>
          <th>الوصف</th>
          <th>المبلغ</th>
        </tr></thead>
        <tbody>
          <tr>
            <td style="font-weight:700;color:#f26522">${serviceLabel}</td>
            <td style="color:#555">${inv.service_desc||"—"}</td>
            <td>${toArabicNum(inv.amount)} ر.س</td>
          </tr>
        </tbody>
      </table>

      <div class="inv-total-row">
        <div class="inv-total-box">
          <div class="inv-total-label">إجمالي المبلغ</div>
          <div class="inv-total-amount"><span class="inv-total-cur">ر.س</span>${toArabicNum(inv.amount)}</div>
        </div>
      </div>

      ${inv.notes ? `
      <div class="inv-notes">
        <div class="inv-notes-label">📝 ملاحظات</div>
        <div class="inv-notes-text">${inv.notes}</div>
      </div>` : ""}
    </div>

    <div class="inv-footer">
      <div style="width:100%;margin-bottom:18px;padding-bottom:18px;border-bottom:1px solid #ede9e2">
        <div style="font-size:10px;font-weight:700;color:#f26522;letter-spacing:1.5px;margin-bottom:10px">💳 معلومات التحويل البنكي</div>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px">
          <div style="background:#fff;border:1px solid #ede9e2;border-radius:10px;padding:12px 14px">
            <div style="font-size:10px;color:#aaa;font-weight:600;margin-bottom:3px">اسم البنك</div>
            <div style="font-size:13px;font-weight:800;color:#1a1a1a">D360 بنك</div>
          </div>
          <div style="background:#fff;border:1px solid #ede9e2;border-radius:10px;padding:12px 14px">
            <div style="font-size:10px;color:#aaa;font-weight:600;margin-bottom:3px">صاحب الحساب</div>
            <div style="font-size:13px;font-weight:800;color:#1a1a1a">احمد بن سعيد بن سلمان آل قريش</div>
          </div>
          <div style="background:#fff;border:1px solid #ede9e2;border-radius:10px;padding:12px 14px">
            <div style="font-size:10px;color:#aaa;font-weight:600;margin-bottom:3px">رقم الآيبان</div>
            <div style="font-size:13px;font-weight:800;color:#1a1a1a;direction:ltr;letter-spacing:.5px">SA5136036036054582261626</div>
          </div>
        </div>
      </div>
      <div class="inv-footer-brand">
        <img src="${LOGO}" alt="">
        دليل صفوى — 1safwa.com
      </div>
      <div class="inv-footer-contact">
        للاستفسار: <a href="mailto:info@1safwa.com">info@1safwa.com</a>
      </div>
    </div>
  `;
  document.getElementById("print-btn").style.display="flex";
}

load();
</script>
</body>
</html>
